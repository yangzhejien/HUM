# Cloudflare Pages - HUM Journal
# SECURITY: Admin credentials are configured via environment variables below.
# NEVER commit real secrets to this file — use `wrangler secret put` for production.
name = "hum-journal"
compatibility_date = "2024-01-01"
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"
database_name = "hum-journal-db"
database_id = "f935f1ba-b798-4862-9795-137e44d50c4b"

# ── Security Environment Variables ──
# These should be set via Cloudflare Dashboard → Pages → Settings → Environment Variables
# Or via: wrangler pages secret put ADMIN_TOKEN
#
# Required:
#   ADMIN_TOKEN          — Secret token for PATCH/DELETE API operations (generate a strong random string)
#   ADMIN_CREDENTIALS    — JSON array of admin accounts, e.g.:
#                          [{"email":"admin@example.com","password":"strong-password","role":"admin","name":"Admin Name"}]
#
# Example setup commands (run these in terminal):
#   wrangler pages secret put ADMIN_TOKEN
#   wrangler pages secret put ADMIN_CREDENTIALS
