<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | HUM Journal</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F8F9FA;
            padding: 2rem;
        }
        .login-box {
            background: white;
            padding: 3rem;
            border: 1px solid #E5E5E5;
            max-width: 400px;
            width: 100%;
        }
        .login-title {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #0A2342;
        }
        .login-subtitle {
            color: #4A5568;
            margin-bottom: 2rem;
            font-size: 0.875rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #111;
        }
        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #E5E5E5;
            font-size: 1rem;
            font-family: inherit;
        }
        .form-input:focus {
            outline: none;
            border-color: #0A2342;
        }
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.2s;
            width: 100%;
        }
        .btn-primary {
            background: #0A2342;
            color: white;
        }
        .btn-primary:hover {
            background: #1E3A5F;
        }
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .error-msg {
            color: #DC2626;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
            padding: 0.75rem;
            background: #FEE2E2;
            border: 1px solid #FECACA;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: #4A5568;
            text-decoration: none;
        }
        .back-link:hover {
            color: #0A2342;
        }
        .admin-info {
            font-size: 0.75rem;
            color: #6B7280;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid #E5E5E5;
        }
        .admin-info strong {
            color: #0A2342;
        }
    </style>
</head>
<body>
    <div class="login-container" id="admin-login">
        <div class="login-box">
            <h1 class="login-title">HUM Journal</h1>
            <p class="login-subtitle">Admin Login / 管理员登录</p>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Username / 用户名</label>
                    <input type="text" id="email" class="form-input" placeholder="Enter your username" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password / 密码</label>
                    <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
                </div>

                <div class="error-msg" id="loginError"></div>

                <button type="submit" class="btn btn-primary" id="submitBtn">Login / 登录</button>
            </form>

            <a href="index.html" class="back-link">← Back to Home / 返回首页</a>

            <div class="admin-info">
                <strong>Admin Accounts:</strong><br>
                主编: Orion<br>
                编辑: Lyra
            </div>
        </div>
    </div>

    <script>
        // ── Security Configuration ──
        const MAX_LOGIN_ATTEMPTS = 5;
        const LOCKOUT_DURATION = 15 * 60 * 1000; // 15 minutes

        // ★ SECURITY FIX: NO hardcoded passwords on frontend!
        // All credential verification is done by POST /api/login on the server.
        // This file only handles UI state and client-side UX.

        const API_BASE = '/api';

        // Use a stable-ish identifier for local tracking
        // Note: real IP-based limiting happens server-side; this is just UI feedback
        function getLocalId() {
            let id = localStorage.getItem('hum_login_id');
            if (!id) {
                id = 'local_' + Math.random().toString(36).substring(2, 10);
                localStorage.setItem('hum_login_id', id);
            }
            return id;
        }

        // Local lockout tracking (UX only — server enforces real rate limit)
        function isLocallyLocked() {
            const data = JSON.parse(localStorage.getItem('hum_lockout') || '{}');
            if (data.until && data.until > Date.now()) return true;
            return false;
        }

        function recordFailedLocalAttempt() {
            const data = JSON.parse(localStorage.getItem('hum_lockout') || '{"count":0}');
            data.count = (data.count || 0) + 1;
            if (data.count >= MAX_LOGIN_ATTEMPTS) {
                data.until = Date.now() + LOCKOUT_DURATION;
                data.count = 0;
            }
            localStorage.setItem('hum_lockout', JSON.stringify(data));
        }

        function clearLocalLockout() {
            localStorage.removeItem('hum_lockout');
        }

        function getLockoutRemaining() {
            const data = JSON.parse(localStorage.getItem('hum_lockout') || '{}');
            if (data.until && data.until > Date.now()) {
                return Math.ceil((data.until - Date.now()) / 1000);
            }
            return 0;
        }

        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginError = document.getElementById('loginError');
        const submitBtn = document.getElementById('submitBtn');

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Check local lockout (UX)
            if (isLocallyLocked()) {
                const remaining = getLockoutRemaining();
                showError(`登录尝试过多，请 ${remaining} 秒后重试。/ Too many attempts. Wait ${remaining}s.`);
                return;
            }

            const email = emailInput.value.toLowerCase().trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showError('请输入用户名和密码。');
                return;
            }
            if (!email.includes('@')) {
                showError('用户名格式不正确。');
                return;
            }

            // Disable button to prevent double-submit
            submitBtn.disabled = true;
            submitBtn.textContent = '验证中... / Verifying...';
            showError('');

            try {
                // ★ Call backend API for verification (never check passwords locally)
                const res = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    // Login successful — store session from server response
                    clearLocalLockout();
                    sessionStorage.setItem('adminLoggedIn', 'true');
                    sessionStorage.setItem('adminEmail', data.email || email);
                    sessionStorage.setItem('adminRole', data.role || 'editor');
                    sessionStorage.setItem('adminName', data.name || 'Admin');

                    // Store admin token for API calls (returned from server)
                    if (data.token) {
                        sessionStorage.setItem('adminToken', data.token);
                    }

                    window.location.href = 'admin.html';
                } else {
                    // Login failed — generic message (prevent account enumeration)
                    recordFailedLocalAttempt();
                    showError('账号或密码错误。/ Invalid credentials.');
                }
            } catch (err) {
                console.error('[Login] Error:', err);
                showError('网络错误，请稍后重试。/ Network error. Please try again.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Login / 登录';
            }
        });

        function showError(msg) {
            loginError.textContent = msg;
            loginError.style.display = 'block';
        }

        emailInput.addEventListener('input', () => { loginError.style.display = 'none'; });
        passwordInput.addEventListener('input', () => { loginError.style.display = 'none'; });
    </script>


<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}

.inland-security-footer {

  z-index: 10;
  bottom: 0;
  right: 0;
  width: fit-content;
  display: flex;
  justify-content: flex-end;
}

.tooltip-container {
  position: relative;
}

.trigger-content {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  padding: 8px;
  background-color: transparent;
  border-radius: 8px;
  cursor: pointer;
}

.minimax-link {
  display: flex;
  align-items: center;
  cursor: pointer;
  font-weight: 300;
  color: #adadad;
  text-decoration: none;
}

.minimax-link:visited {
  color: #adadad;
}

.minimax-link:hover {
  color: #666666;
}

.tooltip-content {
  position: absolute;
  bottom: 100%;
  right: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 8px;
  padding-bottom: 16px; /* 8px 内容间距 + 8px 用于鼠标移动的透明区域 */
  font-size: 12px;
  line-height: 17px;
  background-color: #fafafa;
  border-radius: 12px;
  white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
  color: #171717;
}

/* 创建透明的连接区域，让鼠标可以平滑移动到 tooltip */
.tooltip-content::after {
  content: '';
  position: absolute;
  bottom: -8px;
  left: 0;
  right: 0;
  height: 16px;
}

.tooltip-container:hover .tooltip-content {
  display: flex;
}

.info-section {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
}

.beian-link {
  display: flex;
  align-items: center;
  text-decoration: none;
  color: #171717;
}

.beian-icon {
  width: 14px;
  height: 14px;
  margin-right: 2px;
}

.underline-text {
  color: #171717;
  text-decoration: underline;
}

.underline-text:hover {
  color: #000000;
}

/* 深色模式支持 */
@media (prefers-color-scheme: dark) {
  .trigger-content {
    background-color: transparent;
  }

  .minimax-link,
  .minimax-link:visited {
    color: #666666;
  }

  .minimax-link:hover {
    color: #adadad;
  }

  .tooltip-content {
    background-color: #262626;
    color: #ededed;
  }

  .beian-link,
  .underline-text {
    color: #ededed;
  }

  .underline-text:hover {
    color: #ffffff;
  }
}

</style>
<div class="inland-security-footer">
  <div class="tooltip-container">
    <div class="trigger-content">
      <a href="https://www.minimaxi.com/" target="_blank" rel="noreferrer" class="minimax-link">
        <span></span>
      </a>
    </div>
    <div class="tooltip-content">
      <section class="info-section">
        <span>上海稀宇科技有限公司</span>
      </section>

        <a class="beian-link" href="https://www.beian.gov.cn/portal/registerSystemInfo?recordcode=31010402010179" target="_blank" rel="noreferrer">
          <img alt="hailuo-beian-icon" src="https://cdn.hailuoai.com/hailuo-video-web/public_assets/223037d3-79fd-4db0-a456-749f38a6a14b.png" class="beian-icon">
          <span class="underline-text">沪公网安备31010402010179号</span>
        </a>
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noreferrer" class="underline-text">
          沪ICP备2023003282号-38
        </a>
      </section>

      <section class="info-section"></section>

      <section class="info-section">
        <a href="https://agent.minimaxi.com/doc/zh/terms-of-service.html" target="_blank" rel="noreferrer" class="underline-text">
          用户协议
        </a>
        <a href="https://agent.minimaxi.com/doc/zh/privacy-policy.html" target="_blank" rel="noreferrer" class="underline-text">

</div>

</body>
</html>
