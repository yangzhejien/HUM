<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article Viewer | Humanity & Thought Journal</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: #F5F5F5;
        }
        .viewer-container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .article-header {
            background: white;
            padding: 2rem;
            margin-bottom: 1rem;
            border: 1px solid var(--color-border);
        }
        .article-category {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            font-size: 0.75rem;
            font-weight: 500;
            margin-bottom: 1rem;
        }
        .article-category.public {
            background: #DBEAFE;
            color: #1E40AF;
        }
        .article-category.academic {
            background: #E0E7FF;
            color: #3730A3;
        }
        .article-title {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }
        .article-meta {
            color: var(--color-text-secondary);
            margin-bottom: 1rem;
        }
        .pre-publication-notice {
            background: #FEF3C7;
            border: 1px solid #F59E0B;
            padding: 1rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
        .pre-publication-notice strong {
            color: #92400E;
        }
        .viewer-frame {
            background: white;
            border: 1px solid var(--color-border);
            min-height: 600px;
            position: relative;
        }
        .viewer-toolbar {
            background: #FAFAFA;
            border-bottom: 1px solid var(--color-border);
            padding: 0.75rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .pdf-download-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.8rem;
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
        }
        .pdf-download-btn:hover { opacity: 0.9; }
        @media (max-width: 768px) {
            .viewer-container { padding: 0 0.5rem; margin: 1rem auto; }
            .article-header { padding: 1.25rem; }
            .article-title { font-size: 1.4rem; }
            .viewer-toolbar { flex-direction: column; align-items: stretch; }
            .zoom-controls { justify-content: center; }
            .viewer-frame { min-height: 400px; }
            .document-content { padding: 0.5rem !important; }
        }
        @media (max-width: 480px) {
            .article-title { font-size: 1.2rem; }
            .viewer-container { padding: 0 0.25rem; }
        }
        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .zoom-btn {
            width: 32px;
            height: 32px;
            border: 1px solid var(--color-border);
            background: white;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .zoom-btn:hover {
            background: #E5E5E5;
        }
        .zoom-level {
            min-width: 50px;
            text-align: center;
            font-size: 0.875rem;
        }
        .page-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .page-btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--color-border);
            background: white;
            cursor: pointer;
            font-size: 0.875rem;
        }
        .page-btn:hover {
            background: #E5E5E5;
        }
        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .page-indicator {
            font-size: 0.875rem;
        }
        .fullscreen-btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--color-border);
            background: white;
            cursor: pointer;
            font-size: 0.875rem;
        }
        .fullscreen-btn:hover {
            background: #E5E5E5;
        }
        .document-container {
            padding: 2rem;
            background: white;
            min-height: 500px;
            overflow: auto;
        }
        .document-content {
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.8;
            font-size: 1rem;
            transform-origin: top center;
            transition: transform 0.2s ease;
        }
        .article-footer {
            background: white;
            padding: 1rem 2rem;
            margin-top: 1rem;
            border: 1px solid var(--color-border);
            text-align: center;
        }
        .disclaimer {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
        }
        .back-link {
            display: inline-block;
            margin-top: 1rem;
            color: var(--color-primary);
        }
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--color-text-secondary);
        }
        .error-message {
            text-align: center;
            padding: 3rem;
            color: #DC2626;
        }
        .fullscreen-mode {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: white;
            overflow: auto;
        }
        .fullscreen-mode .viewer-container {
            max-width: 100%;
            margin: 0;
            padding: 1rem;
        }
        .fullscreen-mode .viewer-toolbar {
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .fullscreen-mode .document-container {
            max-height: calc(100vh - 150px);
            overflow: auto;
        }
        /* Sanitized content styling */
        .sanitized-content {
            line-height: 1.8;
            font-size: 1rem;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .sanitized-content img {
            max-width: 100%;
            height: auto;
        }
        @media (max-width: 768px) {
            .viewer-toolbar {
                flex-direction: column;
            }
            .zoom-controls, .page-controls {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="viewer-container" id="viewerContainer">
        <div id="articleContent">
            <div class="loading">加载中... Loading article...</div>
        </div>
    </div>

    <script>
    window.addEventListener('DOMContentLoaded', function() {
        'use strict';

        const API_BASE = '/api';

        // Convert Supabase Storage URL to proxy URL (adds CORS headers)
        function fileProxyUrl(fileUrl) {
          if (!fileUrl) return '';
          // Already going through proxy
          if (fileUrl.includes('/api/files/proxy')) return fileUrl;
          // Encode and route through our CORS-enabled proxy
          return `${API_BASE}/files/proxy?url=${btoa(fileUrl)}`;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const rawId = urlParams.get('id');
        const articleId = rawId ? parseInt(rawId, 10) : null;

        if (!articleId || articleId <= 0) {
            document.getElementById('articleContent').innerHTML =
                '<div class="error-message">无效的文章ID Invalid article ID.<br><a href="javascript:history.back()">返回 Return</a></div>';
            return;
        }

        let article = null;
        let currentZoom = 100;

        async function fetchArticle() {
            try {
                const resp = await fetch(`${API_BASE}/articles/${articleId}`);
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const data = await resp.json();
                if (!data || !data.id) throw new Error('Article not found');
                article = data;
                renderArticle();
            } catch (err) {
                console.error('[ArticleViewer] Load error:', err);
                document.getElementById('articleContent').innerHTML =
                    '<div class="error-message">无法加载文章 Unable to load article.<br><a href="javascript:history.back()">返回 Return</a></div>';
            }
        }

        function renderArticle() {
            if (!article) return;

            const categoryClass = article.category === 'public' ? 'public' : 'academic';
            const categoryLabel = article.category === 'public' ? 'HUM-Public 大众刊' : 'HUM-Academic 专业刊';
            const backUrl = article.category === 'public' ? 'public.html' : 'academic.html';
            const date = formatDate(article.created_at);

            document.getElementById('articleContent').innerHTML = `
                <div class="article-header">
                    <span class="article-category ${categoryClass}">${categoryLabel}</span>
                    <h1 class="article-title">${escapeHtml(article.title)}</h1>
                    <p class="article-meta">${escapeHtml(article.author || 'Anonymous')} | ${date}</p>
                    ${article.doi ? '<p style="font-size:0.875rem;color:var(--color-text-secondary);">DOI: <a href="https://doi.org/' + escapeHtml(article.doi) + '" target="_blank" style="color:var(--color-primary);">' + escapeHtml(article.doi) + '</a></p>' : ''}
                    ${article.abstract ? '<p style="color: var(--color-text-secondary); line-height: 1.6;">' + escapeHtml(article.abstract) + '</p>' : ''}
                </div>

                <div class="pre-publication-notice">
                    <strong>⚠️ 预出版声明 | Pre-Publication Notice</strong><br>
                    本文为预出版版本，待ISSN获批后转为正式出版。<br>
                    This is a pre-publication version. Upon ISSN approval, it will be converted to official publication.
                </div>

                <div class="viewer-frame" id="viewerFrame">
                    <div class="viewer-toolbar">
                        <div class="zoom-controls">
                            <button class="zoom-btn" onclick="zoomOut()" title="缩小 Zoom Out">−</button>
                            <span class="zoom-level" id="zoomLevel">${currentZoom}%</span>
                            <button class="zoom-btn" onclick="zoomIn()" title="放大 Zoom In">+</button>
                            <button class="zoom-btn" onclick="resetZoom()" title="重置 Reset" style="font-size: 0.75rem;">100%</button>
                        </div>
                        <div class="page-controls">
                            <button class="page-btn" onclick="prevPage()">◀ 上一页</button>
                            <span class="page-indicator">页面 Page 1</span>
                            <button class="page-btn" onclick="nextPage()">下一页 ▶</button>
                        </div>
                        <div style="display:flex;gap:0.5rem;align-items:center;">
                            <a id="pdfDownloadBtn" class="pdf-download-btn" style="display:none;" download>⬇ 下载 PDF Download</a>
                            <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ 全屏 Fullscreen</button>
                        </div>
                    </div>
                    <div class="document-container" id="documentContainer">
                        <div class="document-content" id="documentContent" style="transform: scale(${currentZoom/100});">
                            ${renderDocumentBody(article)}
                        </div>
                    </div>
                </div>

                <div class="article-footer">
                    <p class="disclaimer">预出版版本｜仅用于学术参考<br>Pre-Publication Version | For Academic Reference Only</p>
                    <a href="${backUrl}" class="back-link">← 返回列表 Back to List</a>
                </div>
            `;
        }

        function zoomIn() {
            if (currentZoom < 200) {
                currentZoom += 10;
                updateZoom();
            }
        }

        function zoomOut() {
            if (currentZoom > 50) {
                currentZoom -= 10;
                updateZoom();
            }
        }

        function resetZoom() {
            currentZoom = 100;
            updateZoom();
        }

        function updateZoom() {
            document.getElementById('zoomLevel').textContent = currentZoom + '%';
            document.getElementById('documentContent').style.transform = `scale(${currentZoom/100})`;
        }

        function prevPage() {
            // Simple page navigation - scroll up
            window.scrollBy(0, -500);
        }

        function nextPage() {
            // Simple page navigation - scroll down
            window.scrollBy(0, 500);
        }

        function toggleFullscreen() {
            const container = document.getElementById('viewerContainer');
            const isFullscreen = container.classList.contains('fullscreen-mode');

            if (isFullscreen) {
                container.classList.remove('fullscreen-mode');
                document.body.classList.remove('fullscreen-mode');
            } else {
                container.classList.add('fullscreen-mode');
                document.body.classList.add('fullscreen-mode');
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            return new Date(dateStr).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Sanitize HTML: strip script tags, event handlers, dangerous protocols
        function sanitizeHtml(raw) {
            if (!raw || typeof raw !== 'string') return '';
            let html = raw;
            // Remove <script> tags and their content
            html = html.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '');
            // Remove event handler attributes (onclick, onload, onerror, etc.)
            html = html.replace(/\s+on\w+\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+)/gi, '');
            // Remove javascript: and data:text/html URLs in href/src
            html = html.replace(/(href|src)\s*=\s*(?:"javascript:[^"]*"|'javascript:[^']*')/gi, '$1="#"');
            html = html.replace(/(href|src)\s*=\s*(?:"data:\s*text\/html[^"]*"|'data:\s*text\/html[^']*')/gi, '$1="#"');
            // Remove <object>, <embed>, <base>, <meta> tags (can be used for XSS)
            html = html.replace(/<(object|embed|base|meta|link|style|iframe|form|input)[^>]*>/gi, '&lt;$1&gt;');
            return html;
        }

        // Validate URL protocol — only allow https:// and http://
        function isSafeUrl(url) {
            if (!url || typeof url !== 'string') return false;
            const trimmed = url.trim().toLowerCase();
            return trimmed.startsWith('https://') || trimmed.startsWith('http://');
        }

        // Render document body: handles pdf_data (Base64 PDF), file_url (Supabase URL), content (HTML/text)
        function renderDocumentBody(article) {
            // Show download button if PDF is available
            const dlBtn = document.getElementById('pdfDownloadBtn');
            // 1) Base64-encoded PDF stored in pdf_data field
            if (article.pdf_data && typeof article.pdf_data === 'string' && article.pdf_data.length > 100) {
                try {
                    const raw = atob(article.pdf_data);
                    const bytes = new Uint8Array(raw.length);
                    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
                    const blob = new Blob([bytes], { type: 'application/pdf' });
                    const blobUrl = URL.createObjectURL(blob);
                    if (!window._humPdfBlobUrls) window._humPdfBlobUrls = [];
                    window._humPdfBlobUrls.push(blobUrl);
                    if (dlBtn) { dlBtn.href = blobUrl; dlBtn.download = (article.title || 'article') + '.pdf'; dlBtn.style.display = 'inline-flex'; }
                    return '<object data="' + blobUrl + '" type="application/pdf" width="100%" height="800px" style="border:none;">' +
                           '<p style="text-align:center;padding:2rem;">您的浏览器无法直接显示 PDF。<br>' +
                           '<a href="' + blobUrl + '" target="_blank" rel="noopener noreferrer" style="color:var(--color-primary);font-weight:bold;">点此在新窗口打开 PDF / Open PDF in new tab →</a></p>' +
                           '</object>';
                } catch (e) {
                    console.error('[ArticleViewer] PDF decode error:', e);
                    return '<p style="color:#DC2626;">PDF 解码失败 / Failed to decode PDF.</p>';
                }
            }
            // 2) External file URL — MUST validate protocol before embed
            if (article.file_url && isSafeUrl(article.file_url)) {
                const safeUrl = escapeHtml(article.file_url);
                const dlBtn = document.getElementById('pdfDownloadBtn');
                if (dlBtn) { dlBtn.href = article.file_url; dlBtn.download = (article.title || 'article') + '.pdf'; dlBtn.style.display = 'inline-flex'; }
                return '<object data="' + safeUrl + '" type="application/pdf" width="100%" height="800px" style="border:none;">' +
                       '<p style="text-align:center;padding:2rem;">您的浏览器无法直接显示 PDF。<br>' +
                       '<a href="' + safeUrl + '" target="_blank" rel="noopener noreferrer" style="color:var(--color-primary);font-weight:bold;">点此在新窗口打开 PDF / Open PDF in new tab →</a></p>' +
                       '</object>';
            }
            // Reject unsafe file_url silently
            if (article.file_url && !isSafeUrl(article.file_url)) {
                return '<p style="color:#DC2626;text-align:center;">无法显示此文件 / Unable to display this file.</p>';
            }
            // 3) Rich text / HTML content — MUST sanitize before innerHTML rendering
            if (article.content && article.content !== 'PDF submission') {
                const dlBtn = document.getElementById('pdfDownloadBtn');
                if (dlBtn) dlBtn.style.display = 'none';
                const cleanContent = sanitizeHtml(article.content);
                if (!cleanContent.trim()) {
                    return '<p style="text-align: center; color: var(--color-text-secondary);">暂无内容 No content available.</p>';
                }
                return '<div class="sanitized-content">' + cleanContent + '</div>';
            }
            // 4) Nothing available
            return '<p style="text-align: center; color: var(--color-text-secondary);">暂无内容 No content available.</p>';
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.key === '+' || e.key === '=') {
                zoomIn();
            } else if (e.key === '-') {
                zoomOut();
            } else if (e.key === '0') {
                resetZoom();
            } else if (e.key === 'Escape') {
                const container = document.getElementById('viewerContainer');
                if (container.classList.contains('fullscreen-mode')) {
                    toggleFullscreen();
                }
            }
        });

        fetchArticle();

    }); // DOMContentLoaded
    </script>
</body>
</html>
